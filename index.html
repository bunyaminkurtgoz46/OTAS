<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DUVPAN Fabrika</title>
<meta name="description" content="İmalat, kesim, hammadde ve sevkiyat takibi">
<meta name="theme-color" content="#111817">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DUVPAN Fabrika">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* DUVPAN Fabrika — tek sütun, telefon öncelikli; koyu atölye teması (DUVPAN prototipiyle aynı renkler) */
:root {
  --bg: #111817;
  --surface: #18211E;
  --surface-2: #202A27;
  --line: #3A4944;
  --fg: #F4F3EC;
  --fg-2: #B8C2BC;
  --fg-3: #8A978F;
  --primary: #E56A1F;
  --primary-fg: #111817;
  --amber: #F2B544;
  --green: #4D9B69;
  --red: #E0524C;
  --teal: #49A59A;
  --blue: #8298CF;
  --radius: 10px;
  --font-head: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.i { width: 1.15em; height: 1.15em; flex-shrink: 0; vertical-align: -0.2em; }
.num { font-variant-numeric: tabular-nums; }

/* Yerleşim */
.app {
  max-width: 480px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 520px) { body { background: #0b100f; } .app { background: var(--bg); min-height: 100vh; box-shadow: 0 0 0 1px var(--line); } }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.top-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--primary); display: grid; place-items: center; flex-shrink: 0; }
.top-mark svg { width: 26px; height: 26px; }
.top-text { min-width: 0; flex: 1; }
.top-title { font: 700 26px/1 var(--font-head); letter-spacing: .02em; text-transform: uppercase; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-sub { color: var(--fg-2); font-size: 12.5px; margin-top: 3px; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
.icon-btn .i { width: 20px; height: 20px; }

main { display: flex; flex-direction: column; gap: 22px; outline: none; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-title { font: 700 21px/1.1 var(--font-head); letter-spacing: .03em; text-transform: uppercase; margin: 0; }
.sec-meta { color: var(--fg-2); font-size: 12px; font-weight: 600; }
.muted { color: var(--fg-2); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }

/* Kartlar */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card.tight { padding: 0; overflow: hidden; }
.card.example { border-style: dashed; border-color: rgba(242,181,68,.6); background: rgba(242,181,68,.07); }
.card.warn { border-color: rgba(224,82,76,.55); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; }
.item-title { font-weight: 650; font-size: 14.5px; }
.item-sub { color: var(--fg-2); font-size: 12.5px; margin-top: 2px; }
.item .chev { color: var(--fg-3); }
.ico-dot { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); }
.ico-dot .i { width: 18px; height: 18px; }
.t-imalat { color: var(--primary); background: rgba(229,106,31,.14); }
.t-kesim { color: var(--teal); background: rgba(73,165,154,.15); }
.t-talep { color: var(--blue); background: rgba(130,152,207,.16); }
.t-sayim { color: var(--amber); background: rgba(242,181,68,.14); }

/* Büyük rakamlar */
.big { font: 700 44px/0.95 var(--font-head); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.mid { font: 700 28px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.unit { font: 600 16px var(--font-head); color: var(--fg-2); margin-left: 4px; letter-spacing: .03em; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.kv > div { background: var(--surface); padding: 10px 12px; min-width: 0; }
.kv .v { font: 700 19px/1.1 var(--font-head); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Durum çipleri */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.s-red { color: #FF8B85; background: rgba(224,82,76,.17); }
.s-amber { color: var(--amber); background: rgba(242,181,68,.15); }
.s-teal { color: #6CC7BB; background: rgba(73,165,154,.16); }
.s-green { color: #7CC596; background: rgba(77,155,105,.17); }
.s-gray { color: var(--fg-2); background: var(--surface-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--primary); }
.bar.red > span { background: var(--red); } .bar.amber > span { background: var(--amber); } .bar.green > span { background: var(--green); } .bar.teal > span { background: var(--teal); } .bar.gray > span { background: var(--fg-3); }

/* Uyarı kartı */
.alert { border-left: 4px solid var(--red); }
.alert.amber { border-left-color: var(--amber); }
.alert.teal { border-left-color: var(--teal); }
.alert-days { font: 700 34px/1 var(--font-head); font-variant-numeric: tabular-nums; }

/* Düğmeler */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: var(--radius); font-weight: 700; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface-2); text-decoration: none; color: var(--fg); }
.btn .i { width: 18px; height: 18px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.wa { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
.btn.danger { color: #FF8B85; border-color: rgba(224,82,76,.6); background: rgba(224,82,76,.1); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 13px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.link-btn { color: var(--primary); font-weight: 700; font-size: 13px; }

/* Grafik */
.chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 118px; padding-top: 8px; }
.chart .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.chart .colbar { width: 100%; max-width: 34px; border-radius: 5px 5px 2px 2px; background: rgba(229,106,31,.75); min-height: 2px; }
.chart .colbar.today { background: var(--primary); }
.chart .colbar.zero { background: var(--surface-2); }
.chart .cv { font: 700 13px var(--font-head); font-variant-numeric: tabular-nums; }
.chart .cl { font-size: 10.5px; color: var(--fg-2); white-space: nowrap; }
.chart-wrap { position: relative; }
.chart-ref { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(184,194,188,.45); pointer-events: none; }
.chart-ref span { position: absolute; right: 0; top: -16px; font-size: 10.5px; color: var(--fg-2); background: var(--surface); padding: 0 4px; }

/* Alt menü */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabbar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--fg-2); font-size: 11px; font-weight: 600; text-decoration: none; border-radius: 10px; min-height: 52px; justify-content: center; }
.tab .i { width: 21px; height: 21px; }
.tab[aria-current="page"] { color: var(--primary); background: rgba(229,106,31,.12); font-weight: 700; }
.tab-add { justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 8px 22px rgba(0,0,0,.45), 0 0 0 4px var(--bg); }
.tab-add .i { width: 28px; height: 28px; stroke-width: 2.5; }

/* Alt sayfa (form penceresi) */
.sheet-back { position: fixed; inset: 0; background: rgba(5,8,7,.66); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-grip { width: 42px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sheet-title { font: 700 23px/1.1 var(--font-head); text-transform: uppercase; letter-spacing: .03em; margin: 0; }
form, .form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-size: 12.5px; font-weight: 700; color: var(--fg-2); }
.hint { font-size: 12px; color: var(--fg-2); }
.hint.bad { color: #FF8B85; } .hint.good { color: #7CC596; }
input[type=text], input[type=number], input[type=date], input[type=tel], select, textarea {
  width: 100%; min-height: 48px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); padding: 10px 12px; font-size: 16px; color: var(--fg);
}
textarea { min-height: 90px; resize: vertical; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg-2) 50%), linear-gradient(135deg, var(--fg-2) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.stepper button { height: 60px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.stepper button .i { width: 24px; height: 24px; }
.stepper input { min-height: 60px; text-align: center; font: 700 34px var(--font-head); font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 700; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); flex-wrap: wrap; }
.seg label { flex: 1; min-width: 0; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 8px; border-radius: 7px; font-size: 13px; font-weight: 700; color: var(--fg-2); text-align: center; }
.seg input:checked + span { background: var(--primary); color: var(--primary-fg); }
.seg input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 1px; }
details.more { border: 1px dashed var(--line); border-radius: var(--radius); padding: 0 12px; }
details.more > summary { min-height: 46px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--primary); cursor: pointer; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] { padding-bottom: 12px; }
details.more .inner { display: flex; flex-direction: column; gap: 12px; }
.effect { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }
.effect .row + .row { margin-top: 4px; }

/* Bilgi kutuları */
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--surface-2); color: var(--fg-2); font-size: 13px; }
.note .i { margin-top: 2px; color: var(--fg-2); }
.note strong { color: var(--fg); }
.empty { text-align: center; padding: 26px 14px; color: var(--fg-2); }
.filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter button { flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--fg-2); }
.filter button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day-head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); margin: 4px 2px -2px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: right; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); font-weight: 700; padding: 8px 10px; background: var(--surface-2); }
.table th:first-child, .table td:first-child { text-align: left; }
.table td { text-align: right; padding: 9px 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.recipe-row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; }

/* Bildirim */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); z-index: 60; width: max-content; max-width: min(440px, calc(100vw - 32px)); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }

/* Sürüm 2 eklemeleri */
.top .icon-btn + .icon-btn { margin-left: -4px; }
.s-blue { color: #A9BBEA; background: rgba(130,152,207,.18); }
.bar.blue > span { background: var(--blue); }
.alert.blue { border-left-color: var(--blue); }
.t-malzeme { color: #D9A27F; background: rgba(185,121,92,.18); }
.t-galv { color: #C9D4DD; background: rgba(169,183,198,.16); }
.t-santiye { color: #7CC596; background: rgba(77,155,105,.17); }
.pipe { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.pipe span { height: 100%; }
.seg-san { background: var(--green); }
.seg-gal { background: #A9B7C6; }
.seg-fab { background: var(--primary); }
.seg-rem { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.recipe-row label { min-width: 0; }
.recipe-row select { min-height: 44px; }
.btn-row .btn { padding: 0 10px; }

/* v3: yazdırma (stok kontrol listesi) */
#print-root { display: none; }
@media print {
  body > *:not(#print-root) { display: none !important; }
  html, body { background: #fff !important; color: #000 !important; }
  #print-root { display: block; font: 11pt/1.35 system-ui, sans-serif; color: #000; }
  #print-root h1 { font-size: 16pt; margin: 0 0 2mm; }
  #print-root h2 { font-size: 12pt; margin: 6mm 0 2mm; text-transform: uppercase; letter-spacing: .04em; }
  #print-root table { width: 100%; border-collapse: collapse; }
  #print-root th, #print-root td { border: 1px solid #888; padding: 1.5mm 2mm; text-align: left; vertical-align: top; }
  #print-root th { background: #eee; font-size: 9.5pt; }
  #print-root td.r { text-align: right; white-space: nowrap; }
  #print-root td.box { width: 22mm; }
  #print-root .foot { margin-top: 10mm; }
  @page { size: A4; margin: 12mm; }
}
.sug { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 4px; }
.sug.over { color: var(--amber); }
.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.calc-grid .field input { font-weight: 800; font-size: 18px; }
/* v3.1: 7'li alt menü, proje/reçete sayfaları */
.tabbar-in { grid-template-columns: repeat(3, 1fr) 62px repeat(3, 1fr); }
.tab { font-size: 10.5px; min-width: 0; }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab-add { width: 54px; height: 54px; }
.pill { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.pill .i { width: 16px; height: 16px; }
.pill.on { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.step-n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); font: 800 15px var(--font-head); }
.rd-row select, .card.form select { min-height: 44px; }
[aria-invalid="true"] { border-color: var(--red) !important; }

/* Sürüm 4: pano ilerleme özeti */
.card.prog { display: block; text-decoration: none; color: inherit; padding: 12px 14px; }
.prog-rows { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.prog-row { display: grid; grid-template-columns: 92px 1fr 48px; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-2); }
.prog-row strong { text-align: right; color: var(--fg); font: 700 18px/1 var(--font-head); }
.bar.galv > span { background: #A9B7C6; }
.fold-head { width: 100%; text-align: left; }
.fold-chev svg { transition: transform .15s; }
.fold-head[aria-expanded="true"] .fold-chev svg { transform: rotate(90deg); }
/* Sürüm 4: kompakt stok listesi */
.item.cmp { padding: 9px 12px; gap: 10px; min-height: 46px; }
.item.cmp .item-title { font-size: 14px; }
.item.cmp .item-sub { font-size: 12px; margin-top: 1px; }
.qty { font: 700 20px/1 var(--font-head); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.qty .u { font: 600 13px var(--font-head); color: var(--fg-2); margin-left: 3px; }
.qty .s { display: block; font: 500 11px var(--font-body); color: var(--fg-3); margin-top: 2px; }
.grp-head { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px -4px; }
.kind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kind-grid button { min-height: 52px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 14px; color: var(--fg); padding: 6px 10px; }
.kind-grid button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }

</style>
</head>
<body>

  // ---------- Hesaplar ----------
  var C = null;

  function calc() {

  // Proje satırının günlük hızı: projenin kendi son üretim günleri; yoksa ürün hızının üretimdeki projelere bölünmüş payı
  function lineRate(pj, productId) {

    if (pj.status !== 'aktif') return { v: 0, own: false };
    if (days.length) return { v: days.reduce(function (a, d) { return a + m[d]; }, 0) / days.length, own: true };
    var share = S.projects.filter(function (x) { return x.status === 'aktif' && (x.lines || []).some(function (l) { return l.productId === productId && (Number(l.target) || 0) > (((c.produced[x.id] || {})[productId]) || 0); }); }).length;

    var pj = S.projects.find(function (p) { return p.status === 'aktif'; }) || liveProjects()[0];
    return pj && pj.lines && pj.lines[0] ? product(pj.lines[0].productId) : S.products[0];
  }

  function pipe(li) {

  function installBanner() {
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

    return '<div class="card row" style="border-color:rgba(229,106,31,.55)"><div class="top-mark" style="width:36px;height:36px">' + LOGO + '</div>' +
      '<div class="grow"><div class="item-title">Telefona kur</div><div class="item-sub">' + text + '</div></div>' +
      (installEvt ? '<button class="btn primary sm" type="button" data-act="install">Yükle</button>' : '') +
      '<button class="icon-btn" type="button" data-act="install-x" aria-label="Kapat" style="width:36px;height:36px">' + ic('x') + '</button></div>';
  }

  function unknownItems() {
    var c = calc(), parts = [], mats = [];
    S.parts.forEach(function (p) { if (c.fc[p.id].status === 'bilinmiyor') parts.push(p); });
    S.materials.forEach(function (m) { if (c.mfc[m.id].status === 'bilinmiyor') mats.push(m); });
    return { parts: parts, mats: mats };
  }

  // ---------- Pano ----------
  // Proje ilerlemesi (tonaja göre; ağırlığı girilmemiş kalemler hesaba girmez, hiç ağırlık yoksa adede göre)
  function projProgress(pj) {
    var sh = calc().ship[pj.id] || emptyShip(), list = shipItems(pj, 'santiye').filter(function (it) { return it.target > 0; });
    var byKg = list.some(function (it) { return it.weight > 0; });
    var r = { imalat: [0, 0], galv: [0, 0], san: [0, 0] };
    list.forEach(function (it) {
      var w = byKg ? it.weight : 1, T = it.target;
      if (!w) return;
      if (it.prod) { r.imalat[0] += Math.min(T, producedOf(pj, it.prod.id)) * w; r.imalat[1] += T * w; }
      if (it.galv) { r.galv[0] += Math.min(T, sh.gal[it.key] || 0) * w; r.galv[1] += T * w; }
      r.san[0] += Math.min(T, sh.san[it.key] || 0) * w; r.san[1] += T * w;
    });
    function pc(x) { return x[1] > 0 ? x[0] / x[1] * 100 : null; }
    return { imalat: pc(r.imalat), galv: pc(r.galv), san: pc(r.san), byKg: byKg };
  }
  function pctTxt(v) { return v >= 99.95 ? '100' : v > 0 && v < 1 ? '<1' : fmt(Math.floor(v)); }
  function progressCard(pj) {
    var g = projProgress(pj), li = projInfo(pj).main;
    var stCls = { aktif: 's-amber', sirada: 's-blue', durdu: 's-gray', bitti: 's-green' }[pj.status] || 's-gray';
    function row(label, v, cls) {
      if (v == null) return '';
      return '<div class="prog-row"><span>' + label + '</span><div class="bar ' + cls + '"><span style="width:' + Math.min(100, v).toFixed(1) + '%"></span></div><strong class="num">%' + pctTxt(v) + '</strong></div>';
    }
    return '<a class="card prog" href="#proje/' + pj.id + '" aria-label="' + esc(pj.name + ': İmalat %' + pctTxt(g.imalat || 0) + (g.galv != null ? ', Galvaniz %' + pctTxt(g.galv) : '') + ', Şantiye sevk %' + pctTxt(g.san || 0)) + '">' +
      '<div class="row between"><div class="item-title grow">' + esc(pj.name) + '</div><span class="chip ' + stCls + '">' + esc(PSTATUS[pj.status] || '') + '</span></div>' +
      (li ? '<div class="item-sub num">' + fmt(li.done) + ' / ' + fmt(li.target) + ' ' + esc(li.pr ? li.pr.unit : '') + ' üretildi' + (li.finish ? ' · bitiş ' + relDay(li.finish) : '') + '</div>' : '') +
      '<div class="prog-rows">' + row('İmalat', g.imalat, '') + row('Galvaniz', g.galv, 'galv') + row('Şantiye sevk', g.san, 'green') + '</div></a>';
  }

  var panoFold = false;
  function viewPano() {
    var c = calc(), t = c.t, h = '';
    h += installBanner();
    if (!storageOk) h += '<div class="note">' + ic('info') + '<div><strong>Kayıtlar saklanamıyor.</strong> Bu tarayıcı kayıt tutmaya izin vermiyor; sayfa kapanınca girilenler silinir.</div></div>';

    // Projeler: sade ilerleme özeti
    var order = { aktif: 0, sirada: 1, durdu: 2 };
    var live = S.projects.filter(function (p) { return p.status !== 'bitti'; }).sort(function (a, b) { return (order[a.status] || 0) - (order[b.status] || 0); });
    var done = S.projects.length - live.length;
    h += '<section class="sec" aria-labelledby="h-proje"><div class="sec-head"><h2 class="sec-title" id="h-proje">Projeler</h2><a class="link-btn" href="#projeler">' + (done ? 'Biten ' + done + ' · ' : '') + 'Tümü</a></div>' +
      (live.length ? live.map(progressCard).join('') : '<div class="card"><div class="item-title">Süren proje yok</div><button class="btn primary block" type="button" data-act="project-new" style="margin-top:12px">' + ic('plus') + ' Proje ekle</button></div>') +
      '<p class="tiny muted" style="margin:0 2px">Yüzdeler tonaja göre: imalat = üretilen, galvaniz = galvanize giden, şantiye sevk = şantiyeye giden (ek kalemler dahil; ağırlığı girilmemiş kalem hesaba girmez).</p></section>';

    // Bugün (tek satır)
    var todayAll = c.dailyAll[t] || {}, mp = mainProduct(), r = mp ? c.rate[mp.id] : null;
    var todayParts = S.products.filter(function (pr) { return todayAll[pr.id]; }).map(function (pr) { return fmt(todayAll[pr.id]) + ' ' + pr.unit; });
    h += '<div class="card row" style="padding:10px 12px"><span class="ico-dot t-imalat">' + ic('hammer') + '</span><div class="grow"><div class="item-title">Bugün ' + (todayParts.length ? esc(todayParts.join(' · ')) : 'imalat girilmedi') + '</div>' +
      (r ? '<div class="item-sub">Ortalama ' + fmt(r.producing ? r.v : (r.hist || r.cap)) + ' ' + esc(mp.unit) + '/gün' + (r.n ? ' · son ' + r.n + ' üretim günü' : ' · kapasite') + '</div>' : '') + '</div>' +
      '<button class="btn primary sm" type="button" data-act="imalat">' + ic('plus') + ' Gir</button></div>';

    // Uyarılar: katlanır bölüm
    var items = [], urgent = 0;
    var unk = unknownItems();
    if (unk.parts.length || unk.mats.length) {
      items.push('<div class="card" style="border-color:rgba(130,152,207,.6)"><div class="item-title">Mevcut stokları girin</div>' +
        '<div class="item-sub">' + (unk.parts.length ? fmt(unk.parts.length) + ' parçanın' : '') + (unk.parts.length && unk.mats.length ? ' ve ' : '') + (unk.mats.length ? fmt(unk.mats.length) + ' malzemenin' : '') +
        ' fabrikadaki miktarı henüz girilmedi. Sayınca uyarılar ve "kaç günlük kaldı" hesabı başlar.</div>' +
        '<button class="btn primary block" type="button" data-act="toplu-sayim" style="margin-top:12px">' + ic('clipboard-check') + ' Başlangıç sayımını gir</button></div>');
    }
    var pa = S.parts.map(function (p) { return c.fc[p.id]; }).filter(function (f) { return URGENT[f.status]; });
    var ma = S.materials.map(function (m) { return c.mfc[m.id]; }).filter(function (f) { return URGENT[f.status]; });
    pa.map(function (f) { return { s: SEV[f.status], d: f.daysLeft, html: partAlert(f) }; }).concat(ma.map(function (f) { return { s: SEV[f.status], d: f.daysLeft, html: matAlert(f) }; }))
      .sort(function (a, b) { return a.s - b.s || a.d - b.d; }).forEach(function (x) { if (x.s <= SEV.gec) urgent++; items.push(x.html); });
    // Sıradaki işler için alınacak malzeme (tek kartta)
    var buy = S.materials.map(function (m) { return c.mfc[m.id]; }).filter(function (f) { return f.status === 'eksik' || (f.status === 'yeterli' && f.shortage > 0); });
    if (buy.length) {
      items.push('<div class="card tight"><div style="padding:12px 14px 6px"><div class="label">Alınacak malzeme</div><div class="item-sub">Sıradaki ve süren işler için stokta olmayan miktar (siparişte olan düşüldü)</div></div>' +
        '<div class="list">' + buy.map(function (f) {
          return '<button class="item" type="button" data-act="siparis" data-mat="' + f.m.id + '"><div class="grow"><div class="item-title">' + esc(f.m.name) + '</div>' +
            '<div class="item-sub num">Gereken ' + fmtQ(f.need) + ' · stokta ' + fmtQ(f.have) + (f.incoming ? ' · siparişte ' + fmtQ(f.incoming) : '') + '</div></div>' +
            '<span class="chip s-amber num">' + fmtQ(f.shortage) + ' ' + esc(f.m.unit) + '</span><span class="chev">' + ic('chevron-right') + '</span></button>';
        }).join('') + '</div></div>');
    }
    // Tartım hatırlatma ve tolerans dışı
    S.products.forEach(function (pr) {
      if (!c.rate[pr.id].producing && !c.lastWeigh[pr.id]) return;
      var lw = c.lastWeigh[pr.id], since = c.sinceWeigh[pr.id] || 0, every = Number(pr.weighEvery) || 0;
      if (lw) {
        var tc = tartimCheck(lw.e);
        if (tc && tc.target && !tc.ok && lw.e.date >= addDays(t, -7)) { urgent++; items.push('<div class="card warn row"><span style="color:var(--red)">' + ic('scale') + '</span><div class="grow"><div class="item-title">Son tartım tolerans dışı · ' + esc(pr.name) + '</div><div class="item-sub">' + fmt1(tc.w) + ' kg · hedef ' + esc(tolText(pr)) + ' · ' + relDay(lw.e.date) + '</div></div></div>'); }
      }
      if (every && c.rate[pr.id].producing && ((!lw && since > 0) || since >= every)) {
        items.push('<div class="card row"><span style="color:var(--amber)">' + ic('scale') + '</span><div class="grow"><div class="item-title">Tartım zamanı · ' + esc(pr.name) + '</div><div class="item-sub">' +
          (lw ? 'Son tartımdan beri ' + fmt(since) + ' ' + esc(pr.unit) + ' üretildi (her ' + fmt(every) + ' ' + esc(pr.unit) + 'da bir).' : 'Henüz tartım girilmedi. İlk ' + esc(pr.unit) + ' tartılmalı.') + ' Biten imalatı girerken "Detay ekle" → Tartım.</div></div></div>');
      }
    });
    // Eksik kantar fişleri
    var missing = [];
    Object.keys(c.ship).forEach(function (k) { (c.ship[k].missing || []).forEach(function (e) { missing.push(e); }); });
    if (missing.length) {
      items.push('<button class="card row" type="button" data-act="entry" data-id="' + missing[0].id + '" style="text-align:left;width:100%"><span style="color:var(--amber)">' + ic('receipt') + '</span><div class="grow"><div class="item-title">Şantiye kantar fişi eksik</div>' +
        '<div class="item-sub">' + fmt(missing.length) + ' seferin kantar kilosu girilmedi. Hakediş kantara göre yapıldığı için fişi girin.</div></div><span class="chev">' + ic('chevron-right') + '</span></button>');
    }
    if (items.length) {
      h += '<section class="sec" aria-labelledby="h-uyari"><button class="card row fold-head" type="button" data-act="pano-fold" aria-expanded="' + panoFold + '" aria-controls="uyari-body" id="h-uyari">' +
        '<span style="color:' + (urgent ? 'var(--red)' : 'var(--amber)') + '">' + ic('info') + '</span><div class="grow"><div class="item-title">Uyarılar</div><div class="item-sub">' +
        (urgent ? fmt(urgent) + ' acil · ' : '') + fmt(items.length) + ' konu · görmek için dokunun</div></div>' +
        (urgent ? '<span class="chip s-red">' + fmt(urgent) + ' acil</span>' : '<span class="chip s-amber">' + fmt(items.length) + '</span>') + '<span class="chev fold-chev">' + ic('chevron-right') + '</span></button>' +
        '<div class="stack" id="uyari-body"' + (panoFold ? '' : ' hidden') + '>' + items.join('') + '</div></section>';
    } else {
      h += '<div class="card row"><span style="color:var(--green)">' + ic('circle-check') + '</span><div class="grow"><div class="item-title">Uyarı yok</div><div class="item-sub">Parça ve malzeme stokları işlere yetiyor.</div></div></div>';
    }

    h += '<p class="tiny muted" style="text-align:center;margin:0">Kayıtlar bu cihazda saklanıyor. Yedek için Ayarlar → Veri.</p>';
    return h;
  }

  // ---------- Stok ----------
  function partCard(f) {
    var p = f.p, st = STC[f.status], c = calc();
    var L = Math.max(1, Number(p.leadDays) || 1);
    var pct = f.have <= 0 ? 0 : (f.need > 0 ? Math.min(100, f.have / f.need * 100) : 100);
    if (f.use > 0 && Number.isFinite(f.daysLeft)) pct = Math.min(100, f.daysLeft / (L * 3) * 100);
    var cut = c.cut30[p.id] || 0, rej = c.rej30[p.id] || 0, fab = p.source === 'fabrika';
    var mf = f.m && f.m.track ? c.mfc[f.m.id] : null;
    var reqs = f.reqs.map(function (r) {
      var late = f.runOut && r.e.expected > f.runOut && f.use > 0;
      return '<div class="item" style="padding:10px 14px"><span class="ico-dot t-talep">' + ic('truck') + '</span><div class="grow">' +
        '<div class="item-title" style="font-size:13.5px">' + fmt(r.rem) + ' adet bekleniyor' + (r.got ? ' <span class="muted small">(' + fmt(r.got) + ' geldi)</span>' : '') + '</div>' +
        '<div class="item-sub">' + (late ? '<span style="color:#FF8B85">' : '') + 'Teslim ' + relDay(r.e.expected) + (late ? ' · stok daha önce bitiyor</span>' : '') + '</div></div>' +
        '<button class="btn sm wa" type="button" data-act="remind" data-id="' + r.e.id + '" aria-label="WhatsApp ile hatırlat">' + ic('message-circle') + '</button>' +
        '<button class="btn sm" type="button" data-act="entry" data-id="' + r.e.id + '" aria-label="Talep ayrıntısı">' + ic('chevron-right') + '</button></div>';
    }).join('');
    var right = f.use > 0
      ? '<div class="label">Kalan</div><div class="mid">' + daysTxt(f) + '<span class="unit">gün</span></div><div class="tiny muted">' + esc(runOutTxt(f)) + '</div>'
      : '<div class="label">İşler için gereken</div><div class="mid">' + fmt(f.need) + '<span class="unit">adet</span></div>';
    return '<article class="card tight" id="part-' + p.id + '">' +

      '<span class="chip ' + st.cls + '">' + esc(partStatusLabel(f)) + '</span></div>' +
      '<div class="row between" style="margin-top:10px;align-items:flex-end"><div><div class="label">Stok</div><div class="big">' + fmt(f.st) + '<span class="unit">adet</span></div></div>' +
      '<div style="text-align:right">' + right + '</div></div>' +
      '<div class="bar ' + st.bar + '" style="margin-top:10px"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
      (f.st < 0 ? '<div class="hint bad" style="margin-top:8px">Stok eksiye düştü. Girilmemiş bir kesim olabilir; sayım girerek düzeltin.</div>' : '') +
      (mf ? (function () { var lk = locForMethod(p.method), lq = c.mloc[f.m.id][lk];
        return '<div class="small" style="margin-top:8px"><span class="muted">Hammadde:</span> ' + esc(f.m.name) + ' · ' + locIn(lk) + ' <strong class="num">' + fmtQ(lq) + '</strong> ' + esc(f.m.unit) +
        (p.perMaterial > 0 ? ' <span class="muted">(≈ ' + fmt(Math.max(0, lq) * p.perMaterial) + ' adet çıkar)</span>' : '') + ' <span class="chip ' + STC[mf.status].cls + '">' + esc(matStatusLabel(mf)) + '</span>' +
        (locTxt(f.m.id) && Math.abs(lq - mf.st) > 1e-9 ? '<div class="tiny muted">Toplam: ' + esc(locTxt(f.m.id)) + '</div>' : '') + '</div>'; })() : '') +
      (cut ? '<div class="tiny muted" style="margin-top:6px">Son 30 gün: ' + fmt(cut) + ' kesildi, ' + fmt(rej) + ' hatalı (%' + fmt1(rej / cut * 100) + ')</div>' : '') +
      '</div>' +
      '<div class="kv"><div><div class="label">Günlük</div><div class="v">' + fmt(f.use) + '</div></div>' +
      '<div><div class="label">' + (fab ? 'Gereken' : 'Yolda') + '</div><div class="v">' + fmt(fab ? f.need : f.incoming) + '</div></div>' +
      '<div><div class="label">Kesilecek</div><div class="v">' + fmt(f.toCut) + (f.plates && f.m ? '<span class="unit">' + fmt(f.plates) + ' ' + esc(f.m.unit) + '</span>' : '') + '</div></div></div>' +

      '<div style="padding:12px 14px;border-top:1px solid var(--line)" class="stack"><div class="btn-row">' +
      (fab ? '<button class="btn primary" type="button" data-act="kesim" data-part="' + p.id + '" data-mode="fabrika">' + ic('scissors') + ' Kesildi gir</button>' +
        (f.m && f.m.track ? '<button class="btn" type="button" data-act="siparis" data-mat="' + f.m.id + '">' + ic('truck') + ' Malzeme sipariş</button>' : '<button class="btn" type="button" data-act="sayim" data-part="' + p.id + '">' + ic('clipboard-check') + ' Sayım gir</button>')
        : '<button class="btn primary" type="button" data-act="talep" data-part="' + p.id + '">' + ic('send') + ' Kesim iste</button>' +

      '<div class="btn-row">' + (fab && f.m && f.m.track ? '<button class="btn sm" type="button" data-act="sayim" data-part="' + p.id + '">' + ic('clipboard-check') + ' Sayım gir</button>' : (fab ? '' : '<button class="btn sm" type="button" data-act="sayim" data-part="' + p.id + '">' + ic('clipboard-check') + ' Sayım gir</button>')) +
      '<button class="btn sm" type="button" data-act="part-history" data-part="' + p.id + '">' + ic('history') + ' Hareketler</button></div></div></article>';
  }

  function matCard(f) {
    var m = f.m, st = STC[f.status];
    var pct = f.need > 0 ? Math.min(100, f.have / f.need * 100) : 100;
    var reqs = f.reqs.map(function (r) {

  // Kompakt stok satırı: ad, ölçü, miktar; sadece gerekiyorsa konum ve durum

  function matSheet(mid) {

      '<div class="card tight"><table class="table"><tbody>' + rows + '</tbody></table></div>' + info +

      '<div class="btn-row"><button class="btn" type="button" data-act="siparis" data-mat="' + mid + '">' + ic('send') + ' Sipariş</button><button class="btn" type="button" data-act="transfer" data-mat="' + mid + '">' + ic('truck') + ' Transfer</button></div>' +

  // Liste sırası: grup sırası, sonra ad (sayılar doğal sırada)
  function matSort(a, b) {
    var ks = Object.keys(SG), d = ks.indexOf(sgOf(a)) - ks.indexOf(sgOf(b));
    return d || String(a.name).localeCompare(String(b.name), 'tr', { numeric: true }) || (boyLen(a) - boyLen(b)) || String(a.spec).localeCompare(String(b.spec), 'tr', { numeric: true });
  }

  // ---------- Stok kontrol paylaş (WhatsApp / kopyala / yazdır) ----------
  var shareOpt = null;
  function shareRows(o) {
    var c = calc(), groups = [];
    Object.keys(SG).forEach(function (g) {
      if (o.groups.indexOf(g) < 0) return;
      var items = S.materials.filter(function (m) { return m.active !== false && sgOf(m) === g; }).sort(matSort).map(function (m) {
        var known = !!c.mknown[m.id], q = o.loc ? c.mloc[m.id][o.loc] : c.mstock[m.id], f = c.mfc[m.id], L = boyLen(m);
        return { m: m, name: m.name, spec: m.spec || '', thick: m.thick || '', q: q, known: known, unit: m.unit, kg: m.kgPerUnit && q > 0 ? q * m.kgPerUnit : 0, len: L, meters: L && q > 0 ? q * L : 0,
          where: o.loc ? '' : locTxt(m.id), note: m.note || '', need: m.track ? f.need : 0, incoming: f.incoming, shortage: m.track ? f.shortage : 0 };
      }).filter(function (x) { return o.zero ? true : (x.known && Math.abs(x.q) > 1e-9); });
      if (items.length) groups.push({ title: SG[g], items: items });
    });
    if (o.parts && (!o.loc || o.loc === 'fabrika')) {
      var items = S.parts.filter(function (p) { return p.active !== false; }).map(function (p) {
        return { name: p.name, spec: p.spec || '', thick: '', q: c.stock[p.id], known: !!c.known[p.id], unit: 'adet', kg: 0, meters: 0, where: '', note: '', need: c.fc[p.id].need, incoming: 0, shortage: 0 };
      }).filter(function (x) { return o.zero ? true : (x.known && Math.abs(x.q) > 1e-9); });
      if (items.length) groups.push({ title: 'Kesilmiş parçalar (fabrika)', items: items });
    }
    return groups;
  }
  // Ayrıntılı metin: her kalemde adet, toplam metre, ağırlık, konum, ihtiyaç; grup ve genel tonaj
  function shareText(o) {
    var groups = shareRows(o), n = 0, totKg = 0;
    var lines = ['*' + (S.settings.company || 'DUVPAN') + ' Fabrika · Stok listesi*', cap(fmtLong(today())) + (o.loc ? ' · ' + cap(locIn(o.loc)) + 'ki stok' : ' · tüm konumlar') + (S.settings.user ? ' · ' + S.settings.user : '')];
    groups.forEach(function (g) {
      var gKg = g.items.reduce(function (a, x) { return a + x.kg; }, 0);
      totKg += gKg;
      lines.push('', '*' + g.title.toLocaleUpperCase('tr-TR') + '*' + (gKg ? ' (≈ ' + fmt(gKg) + ' kg)' : ''));
      g.items.forEach(function (x) {
        n++;
        var sp = [x.spec, x.thick && x.name.indexOf(x.thick) < 0 ? 't' + x.thick : ''].filter(Boolean).join(' · ');
        var det = [x.meters ? fmt1(x.meters) + ' m' : '', x.kg ? '≈ ' + fmt(x.kg) + ' kg' : ''].filter(Boolean).join(' · ');
        lines.push('• ' + x.name + (sp ? ' (' + sp + ')' : '') + ': ' + (x.known ? '*' + fmtQ(x.q) + ' ' + x.unit + '*' : 'sayılmadı') + (det ? ' — ' + det : ''));
        if (x.where && (x.where.indexOf('·') > 0 || x.where.indexOf('Fabrika') !== 0)) lines.push('   Konum: ' + x.where);
        if (x.need > 1e-9) lines.push('   İşler için gereken ' + fmtQ(x.need) + ' ' + x.unit + (x.incoming ? ' · siparişte ' + fmtQ(x.incoming) : '') + (x.shortage > 0 ? ' · eksik ' + fmtQ(x.shortage) : ''));
        if (x.note) lines.push('   Not: ' + x.note);
      });
    });
    if (!n) lines.push('', 'Seçilen filtrede stok yok.');
    else lines.push('', 'Toplam ' + fmt(n) + ' kalem' + (totKg ? ' · ≈ ' + fmt(totKg) + ' kg' : '') + '. Kontrol edip farkı bildirin.');
    return lines.join('\n');
  }
  function shareHtml(o) {
    var groups = shareRows(o);
    return '<h1>' + esc((S.settings.company || 'DUVPAN') + ' Fabrika · Stok listesi') + '</h1><p>' + esc(cap(fmtLong(today())) + (o.loc ? ' · ' + LOCS[o.loc] : ' · tüm konumlar')) + '</p>' +
      groups.map(function (g) {
        return '<h2>' + esc(g.title) + '</h2><table><thead><tr><th>Kalem</th><th>Ölçü</th><th>Kalınlık</th><th>Sistemde</th><th>Metre / kg</th><th>Konum</th><th>Sayılan</th><th>Not</th></tr></thead><tbody>' +
          g.items.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.spec) + '</td><td>' + esc(x.thick) + '</td><td class="r">' + (x.known ? esc(fmtQ(x.q) + ' ' + x.unit) : 'sayılmadı') + '</td><td class="r">' + esc([x.meters ? fmt1(x.meters) + ' m' : '', x.kg ? fmt(x.kg) + ' kg' : ''].filter(Boolean).join(' · ')) + '</td><td>' + esc(x.where) + '</td><td class="box"></td><td>' + esc(x.note) + '</td></tr>'; }).join('') + '</tbody></table>';
      }).join('') + (groups.length ? '' : '<p>Seçilen filtrede stok yok.</p>') + '<p class="foot">Sayan: ____________ &nbsp; İmza: ____________</p>';
  }
  function readShareOpt(sh) {
    var groups = Array.prototype.filter.call(sh.querySelectorAll('input[name=sg]'), function (x) { return x.checked; }).map(function (x) { return x.value; });
    return { groups: groups, loc: radioVal(sh, 'sloc', ''), parts: sh.querySelector('input[name=sparts]').checked, zero: sh.querySelector('input[name=szero]').checked };
  }
  function presentSG() { var have = {}; S.materials.forEach(function (m) { if (m.active !== false) have[sgOf(m)] = true; }); return Object.keys(SG).filter(function (g) { return have[g]; }); }
  function stokShare() {
    var o = shareOpt || { groups: stokGroup ? [stokGroup] : Object.keys(SG), loc: '', parts: false, zero: false };
    var chk = function (name, val, on, label) { return '<label class="row" style="min-height:40px;gap:10px"><input type="checkbox" name="' + name + '" value="' + val + '"' + (on ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--primary)"><span>' + label + '</span></label>'; };

      '<div class="field"><span class="flabel">Konum</span>' + segRadios('sloc', locs, o.loc) + '</div>' +
      chk('sparts', '1', o.parts, 'Kesilmiş parçaları da ekle (manşon, profil, flanş…)') + chk('szero', '1', o.zero, 'Sıfır ve sayılmamış kalemleri de göster') +
      '<div class="field"><span class="flabel">Önizleme (ayrıntılı)</span><textarea id="share-text" readonly style="min-height:200px"></textarea></div>' +
      '<button class="btn wa block" type="button" data-act="share-wa">' + ic('message-circle') + ' WhatsApp\'ta gönder</button>' +
      '<div class="btn-row"><button class="btn" type="button" data-act="share-copy">' + ic('copy') + ' Kopyala</button><button class="btn" type="button" data-act="share-print">' + ic('download') + ' Yazdır / PDF</button></div></div>',
      function (sh) {

  function shareDo(how) {

  var stokTab = 'uretim', stokGroup = '';
  function viewStok() {

    var now = fcs.filter(function (f) { return f.use > 0; }).sort(function (a, b) { return SEV[a.status] - SEV[b.status] || a.daysLeft - b.daysLeft; });
    var later = fcs.filter(function (f) { return !(f.use > 0) && f.need > 0; }).sort(function (a, b) { return SEV[a.status] - SEV[b.status]; });
    var idle = fcs.filter(function (f) { return !(f.use > 0) && !(f.need > 0); });
    var allMats = S.materials.filter(function (m) { return m.active !== false; });

      var inG = allMats.filter(function (m) { return !stokGroup || sgOf(m) === stokGroup; }).sort(matSort);

        if (!list.length) return;
        var kg = list.reduce(function (a, m) { return a + (c.mknown[m.id] && c.mstock[m.id] > 0 && m.kgPerUnit ? c.mstock[m.id] * m.kgPerUnit : 0); }, 0);
        h += '<div class="grp-head"><span class="label">' + SG[g] + ' · ' + list.length + '</span>' + (kg ? '<span class="tiny muted num">≈ ' + fmt(kg) + ' kg</span>' : '') + '</div><div class="card tight list">' + list.map(matRow).join('') + '</div>';
      });
      if (!inG.length) h += '<div class="card empty">Bu grupta stok kalemi yok.</div>';

  // ---------- Galvaniz ve Şantiye ----------
  function shipRow(e, pj, cum) {

      (cum ? '<div class="tiny muted">' + cum + '</div>' : '') + '</div><span class="chev">' + ic('chevron-right') + '</span></button>';
  }
  function shipSection(type, pj) {
    var c = calc(), sh = c.ship[pj.id] || emptyShip(), items = shipItems(pj, type), gal = type === 'galvaniz';

    }).reverse();

    }

      '<div class="card tight"><div style="overflow-x:auto"><table class="table"><thead><tr><th>Kalem</th><th>Hedef</th><th>Giden</th><th>Kalan</th><th>' + (gal ? 'Hazır' : 'Bekleyen') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="small muted" style="padding:10px 14px;border-top:1px solid var(--line)">' + kgLine + '</div>' + money +
      '<div style="padding:0 14px 12px"><button class="btn primary block" type="button" data-act="' + (gal ? 'galvaniz' : 'santiye') + '" data-project="' + pj.id + '">' + ic('plus') + ' ' + (gal ? 'Galvanize gönder' : 'Şantiyeye sevk') + '</button></div></div>' +

  function viewShip(type) {

    // Parça ihtiyacı

    var pids = Object.keys(need).filter(function (k) { return need[k] > 0 && part(k); });
    if (pids.length) {
      h += '<section class="sec"><div class="sec-head"><h2 class="sec-title">Kalan parça ihtiyacı</h2></div><div class="card tight" style="overflow-x:auto"><table class="table"><thead><tr><th>Parça</th><th>İhtiyaç</th><th>Stok</th><th>Kesilecek</th></tr></thead><tbody>' +
        pids.map(function (k) { var f = c.fc[k]; return '<tr><td>' + esc(part(k).name) + '</td><td>' + fmt(need[k]) + '</td><td>' + (c.known[k] ? fmt(f.st) : '?') + '</td><td>' + fmt(Math.max(0, need[k] - f.have - f.incoming)) + '</td></tr>'; }).join('') +
        '</tbody></table></div><p class="tiny muted" style="margin:0">Stok tüm projeler için ortaktır. "Kesilecek", yoldaki lazer talepleri düşülerek hesaplanır.</p></section>';

    pi.lines.forEach(function (li) { if (!li.pr) return; li.pr.recipe.forEach(function (r) { if (r.materialId && Number(r.qty) > 0) { var m = material(r.materialId); if (m && m.track) mneed[m.id] = (mneed[m.id] || 0) + li.rem * r.qty; } }); });
    (pj.extras || []).forEach(function (x) { var m = material(x.materialId); if (!m || !m.track) return; var sent = extraOut(pj, x); mneed[m.id] = (mneed[m.id] || 0) + Math.max(0, (Number(x.target) || 0) - sent); });

    if (mids.length) {
      h += '<section class="sec"><div class="sec-head"><h2 class="sec-title">Malzeme ihtiyacı</h2></div><div class="card tight" style="overflow-x:auto"><table class="table"><thead><tr><th>Malzeme</th><th>Gereken</th><th>Fabrikada</th><th>Siparişte</th></tr></thead><tbody>' +
        mids.map(function (k) { var m = material(k), f = c.mfc[k]; return '<tr><td>' + esc(m.name) + '</td><td>' + fmt(Math.ceil(mneed[k] - 1e-9)) + ' ' + esc(m.unit) + '</td><td>' + (c.mknown[k] ? fmtQ(f.st) : '?') + '</td><td>' + fmtQ(f.incoming) + '</td></tr>'; }).join('') +
        '</tbody></table></div><p class="tiny muted" style="margin:0">Sadece bu projenin kalan işi için. Fabrikadaki stok diğer projelerle ortaktır.</p></section>';

  // ---------- Geçmiş ----------

        title: (e.type === 'galvaniz' ? 'Galvanize: ' : 'Şantiyeye: ') + esc(itemsText(e, pj)), sub: (pj ? esc(pj.name) + ' · ' : '') + parts.join(' · ') };

      var got = c.mreceived[e.id] || 0, op = !e.closed && got < e.qty;
      return { icon: 'truck', cls: 't-talep', title: mn + ' · ' + fmtQ(e.qty) + ' ' + u + ' sipariş', sub: 'Teslim ' + esc(relDay(e.expected)) + ' · ' + (op ? (got ? fmtQ(got) + ' geldi, açık' : 'açık') : 'kapandı') + (e.supplier ? ' · ' + esc(e.supplier) : '') };

      p = part(e.partId); return { icon: 'clipboard-check', cls: 't-sayim', title: esc(p ? p.name : '—') + ' sayım: ' + fmt(e.counted) + ' adet', sub: 'Parça stoğu bu sayıya eşitlendi' };

  // ---------- Form yardımcıları ----------
  function stepper(id, name, value, label, decimal) {
    return '<div class="stepper"><button type="button" data-step="-1" aria-label="' + label + ' bir azalt">' + ic('minus') + '</button>' +
      '<input id="' + id + '" name="' + name + '" type="number" inputmode="' + (decimal ? 'decimal' : 'numeric') + '" min="0" step="' + (decimal ? 'any' : '1') + '" value="' + esc(value) + '" placeholder="0">' +
      '<button type="button" data-step="1" aria-label="' + label + ' bir artır">' + ic('plus') + '</button></div>';
  }
  function segRadios(name, options, value) {
    return '<div class="seg" role="radiogroup">' + Object.keys(options).map(function (k) {
      return '<label><input type="radio" name="' + name + '" value="' + k + '"' + (k === value ? ' checked' : '') + '><span>' + esc(options[k]) + '</span></label>';
    }).join('') + '</div>';
  }
  function radioVal(f, name, def) { var r = f.querySelector('input[name="' + name + '"]:checked'); return r ? r.value : def; }
  function intVal(form, name) { var v = num(form.elements[name] && form.elements[name].value); return Number.isFinite(v) ? Math.round(v) : NaN; }
  function decVal(form, name) { var v = num(form.elements[name] && form.elements[name].value); return Number.isFinite(v) ? v : NaN; }
  function projOptions(sel, includeIds) {
    var list = S.projects.filter(function (p) { return p.status === 'aktif' || p.status === 'sirada' || (includeIds || []).indexOf(p.id) >= 0; });
    return list.map(function (p) { return '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + ' · ' + esc(PSTATUS[p.status]) + '</option>'; }).join('');
  }
  function defaultProjectId() {
    var e = calc().entries.filter(function (x) { return x.type === 'imalat'; }).slice(-1)[0];
    var pj = e && project(e.projectId);
    if (pj && pj.status === 'aktif') return pj.id;
    var a = S.projects.find(function (p) { return p.status === 'aktif'; }) || liveProjects()[0];
    return a && a.id;
  }
  function stampNew(rec) { return Object.assign({ id: uid('e'), ts: Date.now(), by: S.settings.user || '' }, rec); }
  function saveEntry(entry, rec) {
    if (entry) { Object.assign(entry, rec, { edited: Date.now() }); delete entry.example; }
    else S.entries.push(stampNew(rec));
  }

        var cur = keep ? radioVal(f, 'productId', null) : (entry && entry.projectId === f.elements.projectId.value ? entry.productId : null);
        if (!lines.some(function (l) { return l.productId === cur; })) cur = lines[0] && lines[0].productId;
        sh.querySelector('#im-prod').innerHTML = '<div class="seg" role="radiogroup">' + lines.map(function (l) {
          var pr = product(l.productId); if (!pr) return '';

      }

      f.addEventListener('input', upd);
      f.addEventListener('change', upd);
      prodChoices(false); upd();
      f.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var q = intVal(f, 'qty'), date = f.elements.date.value, prid = radioVal(f, 'productId', null);

  // ---------- Kesim ----------
  function formKesim(entry, partId, mode) {
    var src = entry ? entry.source : (mode || (partId && part(partId) ? part(partId).source : 'fason'));
    var pool = S.parts.filter(function (p) { return p.active !== false && (p.source === src || (entry && p.id === entry.partId)); });
    if (!pool.length) pool = S.parts.filter(function (p) { return p.active !== false; });
    var pid = (entry && entry.partId) || (partId && pool.some(function (p) { return p.id === partId; }) ? partId : null);
    if (!pid) { var needy = pool.map(function (p) { return calc().fc[p.id]; }).sort(function (a, b) { return SEV[a.status] - SEV[b.status]; })[0]; pid = needy && needy.p.id; }
    if (!pid) { toast('Önce bir parça ekleyin'); return; }
    var p0 = part(pid), fab = src === 'fabrika';
    var e = entry || { date: today(), qty: '', rejected: '', partId: pid, method: p0.method, source: src, talepId: null, note: '' };
    var methods = fab ? { testere: 'Testere', plazma: 'Plazma', diger: 'Diğer' } : { lazer: 'Lazer', plazma: 'Plazma', diger: 'Diğer' };
    if (!methods[e.method]) e.method = Object.keys(methods)[0];
    var body = '<form id="f-kesim" novalidate>' +
      '<div class="field"><label for="ks-part">Parça</label><select id="ks-part" name="partId">' + pool.map(function (p) { return '<option value="' + p.id + '"' + (p.id === e.partId ? ' selected' : '') + '>' + esc(partLabel(p)) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="ks-qty">' + (fab ? 'Kesilen adet' : 'Gelen adet') + '</label>' + stepper('ks-qty', 'qty', e.qty, 'Adet') + '<div class="quick" id="ks-quick"></div></div>' +
      '<div class="field"><label for="ks-rej">Hatalı adet</label><input id="ks-rej" name="rejected" type="number" inputmode="numeric" min="0" value="' + esc(e.rejected || '') + '" placeholder="0"><div class="hint">Hatalı parçalar stoğa girmez' + (fab ? ', ama malzemeden düşer' : '') + '.</div></div>' +
      '<div class="field"><span class="flabel">Kesim yöntemi</span>' + segRadios('method', methods, e.method) + '</div>' +
      '<div class="field" id="ks-loc"><span class="flabel">Malzeme hangi stoktan düşsün</span>' + segRadios('mloc', LOCS, e.mloc || locForMethod(e.method)) + '<div class="hint">Lazer kesim lazercideki sacdan, plazma plazmacıdakinden, testere fabrikadakinden düşer.</div></div>' +
      (fab ? '' : '<div class="field"><label for="ks-talep">Hangi talebe ait</label><select id="ks-talep" name="talepId"></select></div>') +
      '<div class="field"><label for="ks-date">Tarih</label><input id="ks-date" name="date" type="date" value="' + e.date + '" max="' + today() + '"></div>' +
      '<div class="field"><label for="ks-note">Not</label><input id="ks-note" name="note" type="text" value="' + esc(e.note) + '" placeholder="' + (fab ? 'Örn. testere 2' : 'Örn. irsaliye no') + '" maxlength="200"></div>' +
      '<div class="effect" id="ks-effect" aria-live="polite"></div>' +
      '<button class="btn primary block" type="submit">' + ic('circle-check') + ' ' + (entry ? 'Değişikliği kaydet' : 'Kaydet') + '</button></form>';
    openSheet(entry ? 'Kesimi düzenle' : (fab ? 'Fabrikada kesildi' : 'Lazerden kesim geldi'), body, function (sh) {
      var f = sh.querySelector('form');
      function fillTalep() {
        if (fab) return;
        var c = calc(), sel = f.elements.talepId, pidNow = f.elements.partId.value;
        var list = (c.open[pidNow] || []).slice();
        if (entry && entry.talepId && entry.partId === pidNow && !list.some(function (r) { return r.e.id === entry.talepId; })) {
          var t = S.entries.find(function (x) { return x.id === entry.talepId; });
          if (t) list.unshift({ e: t, rem: 0, got: 0 });
        }
        var chosen = entry ? (entry.talepId || '') : (list[0] ? list[0].e.id : '');
        sel.innerHTML = '<option value="">Talepsiz giriş</option>' + list.map(function (r) {
          return '<option value="' + r.e.id + '"' + (r.e.id === chosen ? ' selected' : '') + '>' + fmt(r.e.qty) + ' adet · ' + esc(fmtDay(r.e.date)) + ' istendi' + (r.rem ? ' · ' + fmt(r.rem) + ' bekleniyor' : '') + '</option>';
        }).join('');

      }
      function upd() {
        var c = calc(), pidNow = f.elements.partId.value, p = part(pidNow), q = Math.max(0, intVal(f, 'qty') || 0), rj = Math.max(0, intVal(f, 'rejected') || 0);
        var same = entry && entry.partId === pidNow, loc = radioVal(f, 'mloc', 'fabrika'), m0 = material(p.materialId);
        sh.querySelector('#ks-loc').hidden = !(m0 && m0.track && p.perMaterial > 0);
        var base = c.stock[pidNow] - (same ? (Number(entry.qty) || 0) - (Number(entry.rejected) || 0) : 0);
        var fc = c.fc[pidNow], after = base + q - rj, html = '';

          if (fc && fc.use > 0) html += '<div class="row between"><span>Yeter</span><span class="num"><strong>' + fmt1(Math.max(0, after) / fc.use) + '</strong> gün</span></div>';

            html += '<div class="row between"><span>' + esc(m.name) + ' (' + locIn(loc) + ')</span><span class="num' + (mAfter < -1e-9 ? '" style="color:#FF8B85' : '') + '">' + fmtQ(mBase) + ' → <strong>' + fmtQ(mAfter) + '</strong> ' + esc(m.unit) + '</span></div>';

        if (!(q >= 1)) return fieldError(f, 'qty', (fab ? 'Kesilen' : 'Gelen') + ' adedi girin (en az 1).');

        if (!date) return fieldError(f, 'date', 'Tarih seçin.');
        if (date > today()) return fieldError(f, 'date', 'İleri bir tarihe kesim girilemez.');
        saveEntry(entry, { type: 'kesim', partId: f.elements.partId.value, qty: q, rejected: rj, date: date, method: radioVal(f, 'method', 'lazer'), source: src, mloc: radioVal(f, 'mloc', 'fabrika'),
          talepId: fab ? '' : (f.elements.talepId.value || ''), note: f.elements.note.value.trim() });
        commit(part(f.elements.partId.value).name + ': ' + fmt(q - rj) + ' adet stoğa girdi');
      });
    });

  // ---------- Lazere kesim talebi ----------
  function formTalep(entry, partId) {
    var pool = S.parts.filter(function (p) { return p.active !== false && p.source === 'fason'; });
    var pid = (entry && entry.partId) || (partId && part(partId) && part(partId).source === 'fason' ? partId : null);

  // ---------- Yedek ----------
  function backupText() { return JSON.stringify({ app: 'duvpan-fabrika', exported: new Date().toISOString(), state: S }, null, 1); }
  function backupDownload() {
    try {
      var blob = new Blob([backupText()], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'duvpan-fabrika-yedek-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);

  }
  function backupCopy() {
    var text = backupText();
    function manual() {
      openSheet('Yedek metni', '<div class="form"><p class="muted" style="margin:0">Metnin tamamını seçip kopyalayın ve güvenli bir yere yapıştırın.</p><textarea id="bk-text" readonly style="min-height:220px">' + esc(text) + '</textarea></div>',
        function (sh) { var t = sh.querySelector('#bk-text'); t.focus(); t.select(); });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Yedek panoya kopyalandı'); }, manual);
    else manual();
  }
  function backupRestore() {
    openSheet('Yedekten geri yükle', '<form novalidate><p class="muted" style="margin:0">Yedek dosyasını seçin veya yedek metnini yapıştırın. Bu cihazdaki kayıtların yerini alır.</p>' +
      '<div class="field"><label for="rs-file">Yedek dosyası</label><input id="rs-file" name="file" type="file" accept="application/json,.json"></div>' +

      '<button class="btn primary block" type="submit">' + ic('upload') + ' Geri yükle</button></form>', function (sh) {
      var f = sh.querySelector('form');
      f.elements.file.addEventListener('change', function () {
        var file = f.elements.file.files[0]; if (!file) return;

        rd.onload = function () { f.elements.text.value = String(rd.result || ''); };

  function onClick(ev) {

      else if (st.dataset.add) input.value = cur + Number(st.dataset.add);
      else input.value = Number(st.dataset.set);

    }

      case 'np-copy': { npLoad(); var cf = NP.copyFrom || NP.src; if (!cf) { toast('Önce kopyalanacak projeyi seçin'); break; } var keepName = NP.name; npStartCopy(cf); NP.name = keepName; npSave(); render(); toast(project(cf).name + ' kopyalandı'); break; }

      case 'rd-save-new': rdSaveAct(a.dataset.rd, true); break;
      case 'rd-cancel': delete RDS[a.dataset.rd]; go('receteler'); break;
      case 'rd-delete': { var pd = product(id); if (pd) confirmSheet('Reçeteyi sil', '"' + pd.name + '" silinecek.', 'Sil', function () { S.products = S.products.filter(function (x) { return x.id !== id; }); delete RDS['r:' + id]; setRoute('receteler'); commit('Reçete silindi'); }); break; }
      case 'project-edit': formProject(project(id)); break;
      case 'part-new': formPart(null); break;
      case 'part-edit': formPart(part(id || pid)); break;
      case 'product-new': formProduct(null); break;
      case 'product-edit': formProduct(product(id)); break;
      case 'mat-new': formMaterial(null, a.dataset.f); break;
      case 'mat-edit': formMaterial(material(id || mid)); break;
      case 'filter': histFilter = a.dataset.f; histAll = false; render(); break;
      case 'show-all': histAll = true; render(); break;
      case 'pano-fold': panoFold = !panoFold; render(); break;
      case 'stok-tab': stokTab = a.dataset.f; render(); break;
      case 'stok-group': stokGroup = a.dataset.f; render(); break;
      case 'stok-share': stokShare(); break;
      case 'share-wa': shareDo('wa'); break;
      case 'share-copy': shareDo('copy'); break;
      case 'share-print': shareDo('print'); break;
      case 'mat-sheet': matSheet(mid); break;
      case 'pj-status': { var pjx = project(id); if (pjx && pjx.status !== a.dataset.f) { pjx.status = a.dataset.f; commit(pjx.name + ': ' + PSTATUS[pjx.status]); } break; }
      case 'ship-filter': shipFilter = a.dataset.f; render(); break;
      case 'backup-download': backupDownload(); break;
      case 'backup-copy': backupCopy(); break;
      case 'backup-restore': backupRestore(); break;
      case 'reset-all':
        confirmSheet('Tüm kayıtları sil', 'Bu cihazdaki tüm kayıtlar silinecek; projeler, ürünler ve ayarlar başlangıç haline döner. Önce yedek almanızı öneririz.', 'Hepsini sil', function () {
          S = seed(); fixData(S); setRoute('pano'); commit('Tüm kayıtlar silindi');
        });
        break;
      case 'install':
        if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); }
        break;
      case 'install-x':
        try { localStorage.setItem('duvpan-fabrika-kurulum', '1'); } catch (e) { /* yok say */ }
        render();
        break;
    }
  }
  function onSettingChange(ev) {
    var el = ev.target, key = el.dataset && el.dataset.setting;
    if (!key) return;
    var v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') {
      v = num(el.value);
      if (!Number.isFinite(v) || v < Number(el.min || 0)) { el.value = S.settings[key]; toast('Geçerli bir sayı girin'); return; }
    } else v = el.value.trim();
    S.settings[key] = v;
    save(); invalidate();
    toast('Kaydedildi');
  }

  // ---------- Başlat ----------
  function start() {
    LOGO = document.getElementById('top-left').innerHTML;
    curRoute = hashRoute() || 'pano';
    load();
    document.addEventListener('click', onClick);
    // Güvenlik ağı: hiçbir form sayfayı yeniden yüklemesin
    document.addEventListener('submit', function (ev) { ev.preventDefault(); }, true);
    document.addEventListener('change', onSettingChange);
    // Sayfa içi formlar (yeni proje, reçete): taslağa yaz, yeniden çizmeden hesapları güncelle
    function onPageInput(ev) {
      var t = ev.target, d = t && t.dataset;
      if (!d || t.closest('#sheet-root')) return;
      if (d.rd != null && d.rf) rdSet(d.rd, d.ri, d.rf, t, ev.type);
      else if (d.np) { if (ev.type === 'change' && t.type !== 'radio' && t.tagName !== 'SELECT' && t.type !== 'checkbox') return; npSet(d.np, t); }
    }
    document.addEventListener('input', onPageInput);
    document.addEventListener('change', onPageInput);
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && document.querySelector('#sheet-root .sheet')) closeSheet(); });
    window.addEventListener('hashchange', function () { if (hashRoute() !== curRoute) { curRoute = hashRoute() || 'pano'; closeSheet(); render(); window.scrollTo(0, 0); } });
    window.addEventListener('popstate', function () { curRoute = hashRoute() || 'pano'; closeSheet(); render(); window.scrollTo(0, 0); });
    var day = today();
    setInterval(function () { if (today() !== day) { day = today(); invalidate(); render(); } }, 60000);
    window.addEventListener('storage', function (ev) { if (ev.key === LS_KEY) { load(); invalidate(); render(); } });
    render();
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* yok say */ });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* yok say */ });
    }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (route().name === 'pano') render(); });
    window.addEventListener('appinstalled', function () { installEvt = null; toast('Uygulama ana ekrana eklendi'); render(); });
  }

  // Test için küçük arayüz
  window.DUVPAN = { calc: function () { return calc(); }, state: function () { return S; }, reload: function () { load(); invalidate(); render(); }, seed: seed };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
